name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装锁定依赖
        run: uv sync --locked

      - name: 代码风格与静态检查
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run lint-imports --no-cache
          uv run codespell $(git ls-files '*.md')

      - name: 测试
        run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建前端
        working-directory: src/workflow_controller/web/frontend
        run: |
          npm ci
          npm run build

      - name: 构建发行包
        run: uv build

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install.sh 干净环境安装（隔离 HOME）
        env:
          ISOLATED_HOME: ${{ runner.temp }}/isolated-home
        run: |
          mkdir -p "$ISOLATED_HOME"
          HOME="$ISOLATED_HOME" ./install.sh
